# Gerado pela origem das suítes de QA.
name: "QA / Obstáculos ou comportamentos inconsistentes"
on:
  pull_request_target:
  merge_group:
permissions: {}
jobs:
  qa:
    name: "QA / Obstáculos ou comportamentos inconsistentes"
    if: ${{ true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Executar tema de QA
        uses: PROGIC-Tech/.github@qa-pre-merge
        with:
          theme: obstaculos-comportamentos-inconsistentes
          repository: ${{ github.repository }}
