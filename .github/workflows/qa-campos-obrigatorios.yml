# Gerado pela origem das suítes de QA.
name: "QA / Passagem de campos obrigatórios"
on:
  pull_request_target:
  merge_group:
permissions: {}
jobs:
  qa:
    name: "QA / Passagem de campos obrigatórios"
    if: ${{ true }}
    runs-on:
      group: Inteli QA pre-merge
      labels: inteli-qa
    timeout-minutes: 5
    steps:
      - name: Executar tema de QA
        uses: PROGIC-Tech/.github@qa-pre-merge
        with:
          theme: campos-obrigatorios
          repository: ${{ github.repository }}
