name: Executar tema de QA
description: Executa a suíte comum e as suítes de produto aplicáveis ao repositório.
inputs:
  theme:
    description: Nome da pasta do tema em tests.
    required: true
  repository:
    description: Repositório de destino no formato organização/nome.
    required: true
runs:
  using: composite
  steps:
    - name: Executar suítes do tema
      shell: bash
      env:
        QA_THEME: ${{ inputs.theme }}
        QA_REPOSITORY: ${{ inputs.repository }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/run-theme.py" "$QA_THEME" "$QA_REPOSITORY"
